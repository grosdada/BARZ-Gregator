<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Extracteur YouTube</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1e222b; --line:#2a2f3a;
    --txt:#e7e9ee; --dim:#9aa3b2; --accent:#4c8dff; --accent-2:#2f6fe0;
    --in:#4c8dff; --out:#ff9f43;
    --ok:#3ecf8e; --warn:#e8b339; --err:#ff6b6b;
  }
  body[data-barzy-theme="atlas-studio"]{
    --bg:#070909;--panel:#151918;--panel-2:#1c211f;--line:#2b3230;
    --txt:#f0eee8;--dim:#999f9b;--accent:#ff5b3a;--accent-2:#d9472c;
    --in:#84aebe;--out:#f1a36f;--ok:#8cc7a3;--warn:#f1a36f;--err:#ff765a;
  }
  body[data-barzy-theme="sand"]{
    --bg:#e8dbc7;--panel:#f4eadb;--panel-2:#dfcfb8;--line:#c8b494;
    --txt:#29221b;--dim:#655b4f;--accent:#b95c3e;--accent-2:#9f4d34;
    --in:#607c84;--out:#9d653e;--ok:#4f7a60;--warn:#9d653e;--err:#a23f32;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
  .wrap{max-width:940px;margin:0 auto;padding:28px 22px 60px}
  h1{font-size:19px;margin:0;letter-spacing:-.2px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .pills{margin-left:auto;display:flex;gap:6px}
  .pill{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--panel-2);
        color:var(--dim);border:1px solid var(--line)}
  .pill.ok{color:var(--ok);border-color:#25543f}
  .pill.bad{color:var(--err);border-color:#5a2b2b}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:16px;margin-bottom:14px}
  label.h{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;
          color:var(--dim);margin-bottom:7px}
  input[type=text]{width:100%;background:var(--panel-2);border:1px solid var(--line);
        color:var(--txt);border-radius:8px;padding:10px 12px;font-size:14px;outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  .row{display:flex;gap:8px;align-items:center}
  button{background:var(--panel-2);color:var(--txt);border:1px solid var(--line);
         border-radius:8px;padding:10px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
  button:hover:not(:disabled){border-color:#3d4757;background:#242935}
  button:disabled{opacity:.45;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
  .hidden{display:none !important}

  #player{width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
  .meta{display:flex;gap:10px;align-items:baseline;margin:10px 0 4px}
  .meta .t{font-weight:600}
  .meta .d{color:var(--dim);font-size:12px;margin-left:auto;font-variant-numeric:tabular-nums}

  /* ---- panneaux IN / OUT ---- */
  .panes{display:flex;gap:14px;align-items:stretch;margin-top:14px}
  .pane{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);
        border-radius:10px;padding:10px;transition:border-color .15s}
  .pane.active{border-color:var(--accent)}
  .pane[data-h=out].active{border-color:var(--out)}
  .thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:7px;overflow:hidden;
         background:#000 center/cover no-repeat;cursor:pointer}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
             opacity:0;transition:opacity .18s}
  .thumb img.show{opacity:1}
  .badge{position:absolute;left:7px;top:7px;z-index:3;font-size:10px;font-weight:700;
         letter-spacing:.1em;padding:2px 7px;border-radius:5px;background:var(--in);color:#fff}
  .pane[data-h=out] .badge{background:var(--out);color:#241300}
  .spin{position:absolute;right:7px;top:7px;z-index:3;width:12px;height:12px;border-radius:50%;
        border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .7s linear infinite;
        opacity:0;transition:opacity .2s}
  .spin.on{opacity:1}
  @keyframes sp{to{transform:rotate(360deg)}}
  .exact{position:absolute;left:7px;bottom:7px;z-index:3;font-size:10px;padding:2px 6px;
         border-radius:4px;background:rgba(0,0,0,.6);color:#cfd6e2}
  .nudge{display:flex;gap:4px;align-items:center;margin-top:9px}
  .nudge input{flex:1;min-width:0;text-align:center;font-variant-numeric:tabular-nums;
               font-size:15px;padding:8px 4px}
  .nudge button{padding:8px 9px;font-size:12px;color:var(--dim)}
  .paneacts{display:flex;gap:6px;margin-top:6px}
  .paneacts button{flex:1;padding:8px 6px;font-size:12px}

  .dur{align-self:center;text-align:center;min-width:132px;padding:0 2px}
  .dur .ptrim{margin-top:10px;width:100%;padding:6px 6px;font-size:12px;white-space:nowrap}
  .dur .ptrim.on{border-color:var(--accent);color:var(--accent)}
  .dur .v{font-size:22px;font-variant-numeric:tabular-nums;font-weight:600}
  .dur .s{font-size:11px;color:var(--dim)}
  .dur.good .v{color:var(--ok)} .dur.warn .v{color:var(--warn)}

  /* ---- pellicule ---- */
  .track{position:relative;height:56px;margin:16px 4px 8px;background:#0b0d11;
         border:1px solid var(--line);border-radius:8px;cursor:crosshair;user-select:none}
  .clip{position:absolute;inset:0;overflow:hidden;border-radius:7px}
  .strip{position:absolute;inset:0}
  .strip div{position:absolute;top:0;bottom:0;background-repeat:no-repeat;opacity:.62}
  .mask{position:absolute;top:0;bottom:0;background:rgba(8,10,14,.72);pointer-events:none}
  .sel{position:absolute;top:0;bottom:0;border-left:2px solid var(--in);
       border-right:2px solid var(--out);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
       pointer-events:none}
  .head{position:absolute;top:0;bottom:0;width:14px;margin-left:-7px;cursor:ew-resize;z-index:4}
  .head::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:6px;border-radius:3px;
       background:var(--in);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
  .head::after{content:"";position:absolute;left:6px;top:50%;margin-top:-7px;width:2px;height:14px;
       background:rgba(255,255,255,.7);border-radius:1px}
  #h-out::before{background:var(--out)}
  .play{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;
        opacity:.9;z-index:3;box-shadow:0 0 6px rgba(0,0,0,.8)}

  .tlbar{display:flex;gap:6px;align-items:center;margin-top:14px}
  .tlbar button{padding:6px 10px;font-size:12px;color:var(--dim)}
  .tlbar button.wide{padding:6px 11px}
  .zlev{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;
        background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 9px}

  .mini{position:relative;height:14px;margin:0 4px 4px;background:#0b0d11;
        border:1px solid var(--line);border-radius:5px;overflow:hidden;cursor:pointer}
  .msel{position:absolute;top:0;bottom:0;background:rgba(76,141,255,.35)}
  .mwin{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.10);
        border:1px solid rgba(255,255,255,.45);border-radius:4px;cursor:grab}
  .mwin:active{cursor:grabbing}

  .head.off::before{opacity:.3}
  .hover{position:absolute;z-index:9;pointer-events:none;transform:translateX(-50%);
         background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:4px;
         box-shadow:0 8px 24px rgba(0,0,0,.6);display:none}
  .hover.on{display:block}
  .hover .im{width:160px;height:90px;border-radius:5px;background:#000 center/cover no-repeat}
  .hover .tc{text-align:center;font-size:11px;font-variant-numeric:tabular-nums;
             color:var(--dim);padding-top:3px}

  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);
       border-radius:8px;padding:3px}
  .seg button{background:transparent;border:none;padding:8px 18px;border-radius:6px;color:var(--dim)}
  .seg button.on{background:var(--accent);color:#fff;font-weight:600}
  select{background:var(--panel-2);border:1px solid var(--line);color:var(--txt);
         border-radius:8px;padding:9px 10px;font-size:13px}
  .opts{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .chk{display:flex;gap:7px;align-items:center;color:var(--dim);font-size:13px;cursor:pointer}

  .bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin:12px 0 8px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  /* pas de pourcentage disponible : la barre défile pour montrer que ça travaille */
  .bar.indet>i{width:100% !important;transition:none;
    background:repeating-linear-gradient(115deg,var(--accent) 0 14px,#2b4c86 14px 28px);
    background-size:200% 100%;animation:flow 1.1s linear infinite}
  @keyframes flow{from{background-position:0 0}to{background-position:-56px 0}}

  .stage{font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:center}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;
       animation:pulse 1.4s ease-in-out infinite}
  .dot.warn{background:var(--warn);animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .stage .el{font-variant-numeric:tabular-nums}
  .stage .sp{color:#7f8b9e}
  .idle{margin-top:8px;font-size:12px;color:var(--warn);
        background:#2a2313;border:1px solid #574a1f;border-radius:8px;padding:8px 11px}
  pre.log{background:#0b0d11;border:1px solid var(--line);border-radius:8px;padding:10px;
      font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9fb0c9;
      max-height:180px;overflow:auto;margin:10px 0 0;white-space:pre-wrap}
  .msg{padding:11px 13px;border-radius:8px;font-size:13px;margin-top:12px}
  .msg.err{background:#2a1618;border:1px solid #5a2b2b;color:#ffb4b4;white-space:pre-wrap}
  .msg.ok{background:#12261e;border:1px solid #25543f;color:#a8ecc9}
  .hint{color:var(--dim);font-size:12px}
  kbd{background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;
      border-radius:4px;padding:0 4px;font:11px/1.6 ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Extracteur YouTube</h1>
    <div class="pills">
      <span class="pill" id="p-ytdlp">yt-dlp</span>
      <span class="pill" id="p-ffmpeg">ffmpeg</span>
    </div>
  </header>

  <!-- 1. URL -->
  <div class="card">
    <label class="h" for="url">Lien de la vidéo</label>
    <div class="row">
      <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=…" autocomplete="off" spellcheck="false">
      <button id="load">Charger</button>
      <button id="reset" title="Tout remettre à zéro">↺ Réinitialiser</button>
    </div>
    <div id="url-err" class="msg err hidden"></div>
  </div>

  <!-- 2. Lecteur + trim -->
  <div class="card hidden" id="trim-card">
    <div id="player"></div>
    <div class="meta">
      <span class="t" id="v-title">—</span>
      <span class="d" id="v-dur"></span>
    </div>

    <div class="panes">
      <div class="pane active" data-h="in" id="pane-in">
        <div class="thumb" id="th-in">
          <span class="badge">IN</span><span class="spin" id="sp-in"></span>
          <img id="img-in" alt=""><span class="exact" id="ex-in">aperçu</span>
        </div>
        <div class="nudge">
          <button data-h="in" data-d="-1" title="−1 s">«</button>
          <button data-h="in" data-d="-0.1" title="−0,1 s">‹</button>
          <input type="text" id="t-in" value="0:00">
          <button data-h="in" data-d="0.1" title="+0,1 s">›</button>
          <button data-h="in" data-d="1" title="+1 s">»</button>
        </div>
        <div class="paneacts">
          <button id="set-in">⤓ Poser ici</button>
          <button id="go-in">▶ Voir</button>
        </div>
      </div>

      <div class="dur" id="dur-box">
        <div class="v" id="dur-v">—</div>
        <div class="s">durée</div>
        <button id="play-trim" class="ptrim">▶ Lire l'extrait</button>
      </div>

      <div class="pane" data-h="out" id="pane-out">
        <div class="thumb" id="th-out">
          <span class="badge">OUT</span><span class="spin" id="sp-out"></span>
          <img id="img-out" alt=""><span class="exact" id="ex-out">aperçu</span>
        </div>
        <div class="nudge">
          <button data-h="out" data-d="-1" title="−1 s">«</button>
          <button data-h="out" data-d="-0.1" title="−0,1 s">‹</button>
          <input type="text" id="t-out" value="0:00">
          <button data-h="out" data-d="0.1" title="+0,1 s">›</button>
          <button data-h="out" data-d="1" title="+1 s">»</button>
        </div>
        <div class="paneacts">
          <button id="set-out">⤓ Poser ici</button>
          <button id="go-out">▶ Voir</button>
        </div>
      </div>
    </div>

    <div class="tlbar">
      <span class="hint" id="viewinfo"></span>
      <span style="margin-left:auto"></span>
      <span class="zlev" id="zlev">×1</span>
      <button id="z-out" title="Dézoomer">−</button>
      <button id="z-in" title="Zoomer (ou molette sur la pellicule)">+</button>
      <button id="z-sel" class="wide" title="Zoomer sur l'extrait sélectionné">⤢ Sélection</button>
      <button id="z-all" class="wide" title="Revoir toute la vidéo">Tout</button>
    </div>
    <div class="track" id="track">
      <div class="clip">
        <div class="strip" id="strip"></div>
        <div class="mask" id="mask-l"></div>
        <div class="mask" id="mask-r"></div>
        <div class="sel" id="sel"></div>
      </div>
      <div class="play" id="playhead"></div>
      <div class="head" id="h-in"></div>
      <div class="head" id="h-out"></div>
    </div>
    <div class="mini hidden" id="mini">
      <div class="msel" id="msel"></div>
      <div class="mwin" id="mwin"></div>
    </div>
    <div class="hover" id="hov"><div class="im" id="hov-im"></div><div class="tc" id="hov-tc"></div></div>

    <div class="row" style="margin-top:12px;flex-wrap:wrap">
      <button id="preview">▶︎ Écouter la sélection</button>
      <label class="chk"><input type="checkbox" id="full"> Vidéo entière</label>
      <span class="hint" style="margin-left:auto" id="ev-hint"></span>
    </div>
    <div class="hint" style="margin-top:8px">
      <kbd>I</kbd> / <kbd>O</kbd> posent IN/OUT au point de lecture ·
      <kbd>←</kbd><kbd>→</kbd> décalent de 0,1 s (avec <kbd>⇧</kbd> : 1 s) le panneau sélectionné ·
      <span style="opacity:.7">clique hors du lecteur pour que les raccourcis reviennent à l'app</span>
    </div>
  </div>

  <!-- 3. Sortie -->
  <div class="card" id="out-card">
    <div class="opts" style="margin-bottom:14px">
      <div class="seg" id="mode">
        <button data-mode="audio" class="on">🎧 Audio (MP3)</button>
        <button data-mode="video">🎬 Vidéo (MP4)</button>
      </div>
      <select id="quality" class="hidden">
        <option value="1080">1080p max</option>
        <option value="720">720p max</option>
        <option value="480">480p max</option>
        <option value="best">Meilleure qualité</option>
      </select>
    </div>

    <label class="h">Dossier de destination</label>
    <div class="row">
      <input type="text" id="outdir" spellcheck="false">
      <button id="browse">Parcourir…</button>
    </div>

    <div class="row" style="margin-top:16px">
      <button class="primary" id="go" style="flex:1;padding:13px">Extraire</button>
      <button id="cancel" class="hidden">Arrêter</button>
    </div>

    <div id="progress" class="hidden">
      <div class="bar" id="bar"><i id="bar-i"></i></div>
      <div class="stage">
        <span class="dot" id="dot"></span>
        <span id="stage"></span>
        <span class="sp" id="speed"></span>
        <span id="pct" style="margin-left:auto"></span>
        <span class="el" id="elapsed"></span>
      </div>
      <div class="idle hidden" id="idlewarn"></div>
      <pre class="log" id="log"></pre>
    </div>
    <div id="result" class="msg ok hidden"></div>
    <div id="error" class="msg err hidden"></div>
  </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $ = id => document.getElementById(id);
let player=null, ytReady=false, duration=0, SB=null, VURL="";
let IN=0, OUT=0, mode="audio", ACTIVE="in", previewTimer=null;
let ZOOM=1, VIEW0=0;                      // fenêtre visible de la pellicule

/* ---------- temps ---------- */
function fmt(sec){
  sec = Math.max(0, sec||0);
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  const ss=(s<10?"0":"")+s.toFixed(s%1?1:0);
  return h ? `${h}:${String(m).padStart(2,"0")}:${ss}` : `${m}:${ss}`;
}
function parse(str){
  const p=String(str).trim().split(":").map(x=>parseFloat(x.replace(",",".")));
  if(p.some(isNaN)||!p.length) return null;
  return p.reduce((a,v)=>a*60+v,0);
}
const clamp = t => Math.max(0, Math.min(t, duration||t));

/* ---------- fenêtre visible (zoom) ---------- */
function viewLen(){ return duration/ZOOM; }
function clampView(){ VIEW0 = Math.max(0, Math.min(VIEW0, duration - viewLen())); }
function pct(t){ return (t - VIEW0)/viewLen()*100; }      // t -> % de la piste
function maxZoom(){ return duration ? Math.max(1, duration/3) : 1; }  // fenêtre mini : 3 s

function setZoom(z, anchorT){
  if(!duration) return;
  const oldL=viewLen(), oldV0=VIEW0;
  ZOOM=Math.max(1, Math.min(z, maxZoom()));
  const L=viewLen();
  if(anchorT==null) anchorT=oldV0+oldL/2;
  const frac=oldL ? (anchorT-oldV0)/oldL : .5;            // garde le point sous le curseur
  VIEW0=anchorT-L*frac;
  clampView(); buildStrip(); render();
}
function zoomOnSelection(){
  if(!duration) return;
  const a=Math.min(IN,OUT), b=Math.max(IN,OUT), len=Math.max(b-a,1);
  const pad=len*0.25;
  setZoom(Math.min(duration/(len+2*pad), maxZoom()));
  VIEW0=a-pad; clampView(); buildStrip(); render();
}

/* ---------- storyboard ---------- */
function applySb(el,t,w,h){
  if(!SB){ el.style.backgroundImage="none"; return false; }
  const per=SB.rows*SB.cols;
  let idx=Math.floor(t*SB.fps);
  idx=Math.max(0, Math.min(idx, SB.frags.length*per-1));
  const fi=Math.min(Math.floor(idx/per), SB.frags.length-1);
  const pos=idx-fi*per, r=Math.floor(pos/SB.cols), c=pos%SB.cols;
  el.style.backgroundImage=`url("${SB.frags[fi]}")`;
  el.style.backgroundSize=`${SB.cols*w}px ${SB.rows*h}px`;
  el.style.backgroundPosition=`-${c*w}px -${r*h}px`;
  return true;
}

/* ---------- pellicule ---------- */
function buildStrip(){
  const track=$("track"), strip=$("strip");
  const W=track.clientWidth, H=track.clientHeight;
  strip.innerHTML="";
  if(!duration||!W) return;
  const ideal=Math.round(H*16/9);
  const n=Math.max(1, Math.round(W/ideal));
  const cw=W/n;
  const L=viewLen();
  for(let i=0;i<n;i++){
    const d=document.createElement("div");
    d.style.left=(i*cw)+"px"; d.style.width=Math.ceil(cw)+"px";
    applySb(d, VIEW0+(i+0.5)/n*L, cw, H);
    strip.append(d);
  }
  if(!SB) strip.style.background="linear-gradient(90deg,#141821,#1b2130,#141821)";
  $("viewinfo").textContent = `vue : ${fmt(VIEW0)} → ${fmt(VIEW0+L)}`;
  $("zlev").textContent = "×" + (ZOOM<10 ? ZOOM.toFixed(1).replace(".0","") : Math.round(ZOOM));
  $("mini").classList.toggle("hidden", ZOOM<=1.001);
  if(duration){
    $("mwin").style.left=(VIEW0/duration*100)+"%";
    $("mwin").style.width=(L/duration*100)+"%";
    const a=Math.min(IN,OUT), b=Math.max(IN,OUT);
    $("msel").style.left=(a/duration*100)+"%";
    $("msel").style.width=((b-a)/duration*100)+"%";
  }
}
window.addEventListener("resize", buildStrip);

/* ---------- lecteur ---------- */
window.onYouTubeIframeAPIReady = () => { ytReady=true; };
function mountPlayer(id){
  if(player){ player.loadVideoById(id); return; }
  if(!ytReady){ return setTimeout(()=>mountPlayer(id),300); }
  player=new YT.Player("player",{
    videoId:id, playerVars:{rel:0,modestbranding:1,playsinline:1},
    events:{ onReady:()=>{ if(!duration) duration=player.getDuration()||0; render(); } }
  });
}
function now(){ try{ return player&&player.getCurrentTime?player.getCurrentTime():0; }catch(e){ return 0; } }
setInterval(()=>{
  if(!player||!duration) return;
  const p=pct(now());
  const ph=$("playhead");
  ph.style.left=Math.max(0,Math.min(p,100))+"%";
  ph.style.opacity=(p<-1||p>101) ? 0 : .9;
},200);

let lastSeek=0;
/* hold = on se cale sur l'image sans lancer la lecture (cas du trim) */
function liveSeek(t, force, hold=true){
  if(!player||!player.seekTo) return;
  const n=performance.now();
  if(!force && n-lastSeek<140) return;
  lastSeek=n;
  try{
    const st = player.getPlayerState ? player.getPlayerState() : 1;
    player.seekTo(t,true);
    if(!hold) return;
    if(st === -1 || st === 5){
      // lecteur jamais démarré : il n'affiche rien tant qu'il n'a pas tourné.
      // On l'amorce le temps d'une image, puis on le fige — ensuite les seeks
      // suivants affichent la frame sans relancer la lecture.
      player.playVideo();
      setTimeout(()=>{ try{ player.pauseVideo(); }catch(e){} }, 400);
    } else if(player.pauseVideo){
      player.pauseVideo();
    }
  }catch(e){}
}

/* ---------- images exactes ---------- */
const tok={in:0,out:0}, tmr={in:null,out:null};
function refreshExact(which){
  const t=which==="in"?IN:OUT, img=$("img-"+which), my=++tok[which];
  img.classList.remove("show");
  $("ex-"+which).textContent="aperçu";
  clearTimeout(tmr[which]);
  tmr[which]=setTimeout(()=>{

    const src=`/api/frame?u=${encodeURIComponent(VURL)}&t=${t.toFixed(2)}`;
    const probe=new Image();
    probe.onload=()=>{

      img.src=src; img.classList.add("show");
      $("ex-"+which).textContent="image exacte";
      $("sp-"+which).classList.remove("on");
    };
    probe.onerror=()=>{ if(my===tok[which]) $("sp-"+which).classList.remove("on"); };
    probe.src=src;
  }, 400);
}
function paintPane(which){
  const t=which==="in"?IN:OUT, th=$("th-"+which);
  applySb(th, t, th.clientWidth||220, th.clientHeight||124);
  refreshExact(which);
}

/* ---------- rendu ---------- */
function render(paneRefresh){
  const full=$("full").checked;
  const a=Math.min(IN,OUT), b=Math.max(IN,OUT);
  if(duration){
    const pa=pct(a), pb=pct(b);
    const ca=Math.max(0,Math.min(pa,100)), cb=Math.max(0,Math.min(pb,100));
    $("sel").style.left=ca+"%"; $("sel").style.width=Math.max(0,cb-ca)+"%";
    $("h-in").style.left=ca+"%"; $("h-out").style.left=cb+"%";
    $("h-in").classList.toggle("off", pa<0||pa>100);
    $("h-out").classList.toggle("off", pb<0||pb>100);
    $("mask-l").style.left="0"; $("mask-l").style.width=ca+"%";
    $("mask-r").style.left=cb+"%"; $("mask-r").style.width=(100-cb)+"%";
    $("msel").style.left=(a/duration*100)+"%";
    $("msel").style.width=((b-a)/duration*100)+"%";
  }
  if(document.activeElement!==$("t-in"))  $("t-in").value=fmt(IN);
  if(document.activeElement!==$("t-out")) $("t-out").value=fmt(OUT);

  const len=Math.max(0,b-a), box=$("dur-box");
  box.className="dur";
  $("dur-v").textContent = full ? "tout" : fmt(len);
  $("play-trim").disabled = full;
  if(full && trimWatch) trimStop();
  if(!full&&mode==="audio"){
    if(len>=60&&len<=180) box.classList.add("good");
    else if(len>0) box.classList.add("warn");
  }
  $("ev-hint").textContent = (!full&&mode==="audio")
    ? (len>=60&&len<=180 ? "✓ bonne longueur pour un clone de voix"
       : len ? "cible : 60 à 180 s pour un clone de voix" : "") : "";

  document.querySelectorAll(".pane").forEach(p=>{
    p.classList.toggle("active", p.dataset.h===ACTIVE && !full);
    p.style.opacity = full ? .45 : 1;
    p.querySelectorAll("button,input").forEach(el=>el.disabled=full);
  });
  $("preview").disabled=full;
  $("track").style.opacity = full ? .35 : 1;
  if(paneRefresh) paneRefresh.forEach(paintPane);
}

/* ---------- déplacement des points ---------- */
function setPoint(which,t,opts={}){
  t=clamp(t);
  const len=Math.max(0.5, OUT-IN);
  // Saisir un IN au-delà du OUT (ou l'inverse) déplace l'autre point en gardant
  // la longueur de l'extrait, au lieu de rabattre la sélection sans rien dire.
  if(which==="in"){
    if(t >= OUT-0.1){ OUT=clamp(t+len); IN=Math.min(t, OUT-0.1); }
    else IN=t;
  }else{
    if(t <= IN+0.1){ IN=Math.max(0, t-len); OUT=Math.max(t, IN+0.1); }
    else OUT=t;
  }
  IN=Math.max(0,IN); OUT=clamp(OUT);
  ACTIVE=which;
  render(opts.quiet?null:[which]);
  if(opts.seek!==false) liveSeek(which==="in"?IN:OUT, opts.force);
}

/* ---------- drag ---------- */
function tAt(e){
  const r=$("track").getBoundingClientRect();
  return VIEW0 + Math.min(Math.max(e.clientX-r.left,0), r.width)/r.width*viewLen();
}
function dragger(which){
  return e=>{
    if($("full").checked||!duration) return;
    e.preventDefault();
    ACTIVE=which;
    try{ player&&player.pauseVideo&&player.pauseVideo(); }catch(err){}
    const th=$("th-"+which);
    const move=ev=>{
      if(ZOOM>1){                                 // bord atteint : la vue suit
        const r=$("track").getBoundingClientRect(), edge=28, step=viewLen()*0.03;
        if(ev.clientX<r.left+edge){ VIEW0-=step; clampView(); buildStrip(); }
        else if(ev.clientX>r.right-edge){ VIEW0+=step; clampView(); buildStrip(); }
      }
      const t=tAt(ev);
      if(which==="in") IN=Math.min(clamp(t), OUT-0.1); else OUT=Math.max(clamp(t), IN+0.1);
      IN=Math.max(0,IN);
      render();                                   // pas d'appel réseau pendant le glissé
      applySb(th, which==="in"?IN:OUT, th.clientWidth, th.clientHeight);
      showHover(ev, which==="in"?IN:OUT);
      liveSeek(which==="in"?IN:OUT);              // le lecteur suit en direct
    };
    const up=()=>{
      document.removeEventListener("pointermove",move);
      document.removeEventListener("pointerup",up);
      hideHover();
      liveSeek(which==="in"?IN:OUT, true);
      render([which]);                            // et là on va chercher l'image exacte
    };
    document.addEventListener("pointermove",move);
    document.addEventListener("pointerup",up);
  };
}
$("h-in").addEventListener("pointerdown", dragger("in"));
$("h-out").addEventListener("pointerdown", dragger("out"));

/* ---------- survol de la pellicule ---------- */
function showHover(e,t){

  applySb($("hov-im"), t, 160, 90);

  hov.classList.add("on");

  hov.style.left=(x-$("hov").offsetParent.getBoundingClientRect().left)+"px";
  hov.style.top=(track.top-$("hov").offsetParent.getBoundingClientRect().top-110)+"px";
}
function hideHover(){ $("hov").classList.remove("on"); }
$("track").addEventListener("pointermove", e=>{

});

/* déplacement de la fenêtre depuis la minimap */
function miniT(e){

}
$("mwin").addEventListener("pointerdown", e=>{

                 document.removeEventListener("pointerup",up); };

/* Lecture de la seule sélection. On surveille la position réelle du lecteur au
   lieu de poser un minuteur sur (OUT-IN) : le temps de mise en mémoire tampon
   n'est pas compté dedans, et l'extrait débordait d'autant. Un deuxième clic
   arrête ; reprendre la main sur le lecteur (pause, ou saut ailleurs) rend
   aussi le bouton à son état de repos. */
let trimWatch=null, trimT0=0;
function trimStop(){
  clearInterval(trimWatch); trimWatch=null;
  clearTimeout(previewTimer); previewTimer=null;
  try{ player&&player.pauseVideo&&player.pauseVideo(); }catch(e){}
  const b=$("play-trim");
  b.textContent="▶ Lire l'extrait"; b.classList.remove("on");
  $("preview").textContent="▶︎ Écouter la sélection";
}
function trimPlay(){
  if(!player||!player.seekTo) return;
  if(trimWatch){ trimStop(); return; }
  clearTimeout(previewTimer);
  player.seekTo(IN,true); player.playVideo();
  trimT0=Date.now();
  const b=$("play-trim");
  b.textContent="■ Arrêter"; b.classList.add("on");
  $("preview").textContent="■ Arrêter";
  trimWatch=setInterval(()=>{
    const t=now(), age=Date.now()-trimT0;
    if(t>=OUT-0.05){ trimStop(); return; }
    if(age<900) return;                 // le lecteur n'a pas fini de démarrer
    if(t<IN-1.5){ trimStop(); return; } // l'utilisateur est parti ailleurs
    const st=player.getPlayerState?player.getPlayerState():1;
    if(st===0||st===2) trimStop();      // fini, ou mis en pause à la main
  }, 120);
}
$("play-trim").onclick = trimPlay;
$("preview").onclick   = trimPlay;
document.addEventListener("keydown", e=>{
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if($("trim-card").classList.contains("hidden")||$("full").checked) return;
  const k=e.key.toLowerCase();
  if(k==="i"){ e.preventDefault(); $("set-in").click(); }
  else if(k==="o"){ e.preventDefault(); $("set-out").click(); }
  else if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
    e.preventDefault();
    const step=(e.shiftKey?1:0.1)*(e.key==="ArrowRight"?1:-1);
    setPoint(ACTIVE, (ACTIVE==="in"?IN:OUT)+step, {force:true});
  }
});

function ytId(u){ const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/); return m?m[1]:null; }

function durTxt(sec){
  sec=Math.round(sec||0);
  const m=Math.floor(sec/60), r=sec%60;
  return m ? `${m} min ${String(r).padStart(2,"0")} s` : `${r} s`;
}
const DEAD="Le serveur ne répond plus.\n\nRelance l'app, puis recharge cette page."
         +"\n(macOS : icône « Extracteur YouTube » sur le Bureau — Windows : « Extracteur YouTube.bat »)"
         +"\n\nSi une extraction était en cours, elle a été interrompue : relance-la,"
         +" aucun fichier incomplet n'est conservé.";
let misses=0;
async function tick(){
  let s;
  try{
    const r=await fetch("/api/status");
    if(!r.ok) throw new Error(r.status);
    s=await r.json(); misses=0;
  }catch(e){
    if(++misses<5) return;            // simple hoquet : on retente quelques fois
    return fail(DEAD);
  }
  // barre : pourcentage réel quand on en a un, sinon défilement continu
  $("bar").classList.toggle("indet", !s.determinate && !s.done);
  if(s.determinate) $("bar-i").style.width=s.percent+"%";
  $("pct").textContent = s.determinate && s.percent ? s.percent.toFixed(0)+"%" : "";
  $("stage").textContent=s.stage||"";
  $("speed").textContent=s.speed||"";
  $("elapsed").textContent=s.elapsed?durTxt(s.elapsed):"";

  // témoin d'activité : dit franchement depuis quand rien n'a bougé
  const idle=s.idle||0, stuck=idle>45;
  $("dot").classList.toggle("warn", stuck);
  $("idlewarn").classList.toggle("hidden", !stuck || s.done);
  if(stuck) $("idlewarn").textContent =
    `Aucun signe d'activité depuis ${durTxt(idle)}. Sur une vidéo longue, l'analyse `
    + `ou la conversion peut rester muette un moment — mais si ça dépasse deux ou trois `
    + `minutes, tu peux Arrêter sans rien casser : aucun fichier incomplet n'est conservé.`;
  const log=$("log"), stick=log.scrollTop+log.clientHeight>=log.scrollHeight-20;
  log.textContent=(s.lines||[]).join("\n");
  if(stick) log.scrollTop=log.scrollHeight;
  if(s.done){
    clearInterval(poll);
    $("bar").classList.remove("indet");
    $("idlewarn").classList.add("hidden");
    $("dot").classList.remove("warn");
    if(s.ok) $("bar-i").style.width="100%";
    $("go").disabled=false; $("cancel").classList.add("hidden");
    if(s.ok) succeed(s.files); else fail(s.error||"Extraction interrompue.");
  }
}
function succeed(files){
  const box=$("result"); box.innerHTML="";
  files.forEach(f=>{
    const row=document.createElement("div");
    row.className="row"; row.style.marginTop="6px";
    row.innerHTML=`<span style="flex:1;word-break:break-all">✓ ${f.split("/").pop()}</span>`;
    const b1=document.createElement("button"); b1.textContent="Ouvrir";
    b1.onclick=()=>fetch("/api/play",{method:"POST",body:JSON.stringify({path:f})});
    const b2=document.createElement("button"); b2.textContent="Finder";
    b2.onclick=()=>fetch("/api/reveal",{method:"POST",body:JSON.stringify({path:f})});
    row.append(b1,b2); box.append(row);
  });
  box.classList.remove("hidden");
}
function fail(msg){
  clearInterval(poll); poll=null;
  $("error").textContent=msg; $("error").classList.remove("hidden");
  $("go").disabled=false; $("cancel").disabled=false;
  $("cancel").classList.add("hidden");
  $("stage").textContent="";
}

    if(!clean)return value;
    const exact=barzLanguage==="fr"?barzYoutubeReverse.get(clean):barzYoutubeDictionary.get(clean);
    if(exact!==undefined)return value.replace(clean,exact);
    if(barzLanguage==="en"){
      if(/^vue : /.test(clean))return value.replace(clean,clean.replace(/^vue : /,"view: "));
      if(/^durée totale /.test(clean))return value.replace(clean,clean.replace(/^durée totale /,"total duration "));
      if(/^(yt-dlp|ffmpeg) manquant$/i.test(clean))return value.replace(clean,clean.replace(/manquant$/,"missing"));
    }
    return value;
  }
  function barzText(node,capture=false){
    if(node.parentElement?.closest("script,style,textarea,pre,code,[contenteditable='true']"))return;
    if(capture||!barzOriginalText.has(node))barzOriginalText.set(node,node.nodeValue);
    const next=barzTranslateCore(barzOriginalText.get(node));
    if(node.nodeValue!==next){barzAppliedText.set(node,next);node.nodeValue=next;}
  }
  function barzElement(element,capture=false){
    for(const name of ["placeholder","title","aria-label"]){
      if(!element.hasAttribute(name))continue;
      let values=barzOriginalAttributes.get(element);if(!values){values=new Map();barzOriginalAttributes.set(element,values);}
      if(capture||!values.has(name))values.set(name,element.getAttribute(name));
      element.setAttribute(name,barzTranslateCore(values.get(name)));
    }
  }
  function barzTranslateTree(target,capture=false){
    if(!target)return;if(target.nodeType===Node.TEXT_NODE)return barzText(target,capture);
    if(!(target instanceof Element||target instanceof Document))return;if(target instanceof Element)barzElement(target,capture);
    const walker=document.createTreeWalker(target,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);
    while(walker.nextNode())walker.currentNode.nodeType===Node.TEXT_NODE?barzText(walker.currentNode,capture):barzElement(walker.currentNode,capture);
  }
  function barzSetLanguage(next){barzLanguage=next==="fr"?"fr":"en";document.documentElement.lang=barzLanguage;barzApplying=true;try{barzTranslateTree(document);}finally{barzApplying=false;}}
  const barzObserver=new MutationObserver(mutations=>{if(barzApplying)return;barzApplying=true;try{for(const mutation of mutations){if(mutation.type==="characterData"){if(barzAppliedText.get(mutation.target)===mutation.target.nodeValue)barzAppliedText.delete(mutation.target);else barzText(mutation.target,true);}mutation.addedNodes.forEach(node=>barzTranslateTree(node,true));}}finally{barzApplying=false;}});
  barzTranslateTree(document,true);barzSetLanguage("en");barzObserver.observe(document.body,{childList:true,subtree:true,characterData:true});
  window.addEventListener("message",event=>{
    if(!/^http:\/\/(?:127\.0\.0\.1|localhost):\d+$/.test(event.origin)||event.data?.type!=="barz:preferences")return;
    document.body.dataset.barzyTheme=event.data.theme==="sand"||event.data.theme==="light"?"sand":"atlas-studio";
    barzSetLanguage(event.data.language);
  });
  document.body.dataset.barzyTheme="atlas-studio";
  if(window.parent!==window)window.parent.postMessage({type:"barz-youtube-extractor:ready"},"*");
</script>
